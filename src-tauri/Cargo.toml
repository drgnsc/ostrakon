[package]
name = "ostrakon"
version = "0.1.0"
description = "Local, read-only Markdown viewer styled as an ancient artifact"
authors = ["Orphalese Solutions"]
edition = "2021"
license = "MIT"
repository = "https://github.com/drgnsc/ostrakon"

[lib]
name = "ostrakon_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
ammonia = "4"
walkdir = "2"
percent-encoding = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
